name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers the build whenever you update your code
  schedule:
    - cron: '0 0 * * *'  # Automatically fetches the latest Postman collection every night at midnight
  workflow_dispatch: # Allows you to click a button in GitHub to manually update the docs anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create Build Directory
        run: mkdir -p dist

      - name: Fetch OpenAPI Spec from Postman API
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          # REPLACE <YOUR_COLLECTION_ID> WITH YOUR ACTUAL POSTMAN ID
          curl -X GET "https://getpostman.com" \
            -H "X-Api-Key: $POSTMAN_API_KEY" \
            -o dist/swagger.json

      - name: Move existing index.html to Build Directory
        run: |
          # This copies your existing index.html into the deployment folder
          cp index.html dist/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
