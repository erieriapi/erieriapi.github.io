<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>API Documentation</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-uibody>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.i-dist@5.29.5/swagger-ui-bundle.jsscript>
  <script/unpkg.com/swagger-ui-dist@5.29.5/swagger-ui-standalone-preset.jsscript>

  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: "./swagger.json",
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
